name: Integration Tests

# Run when code that affects repository logic, tests, or security rules changes.
# Skipped automatically on PRs that only touch docs, UI, or l10n files.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'lib/repositories/**'
      - 'lib/models/**'
      - 'lib/services/**'
      - 'integration_test/**'
      - 'firestore.rules'
      - 'firebase.json'
      # Run when the workflow itself changes, so CI edits are verified on the PR.
      - '.github/workflows/integration_tests.yml'
  # Allow manual runs (e.g. to confirm a fix or re-check a flake).
  workflow_dispatch:

jobs:
  integration-tests:
    # Windows runner required: Flutter integration_test does not support web (-d chrome),
    # and cloud_firestore does not support the Linux desktop target. Windows desktop
    # matches the local dev workflow and has full FlutterFire support.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Java is required by the Firestore emulator binary.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        # Pinned (was unpinned `firebase-tools`) so the bundled Firestore emulator
        # version is reproducible and cannot silently drift between runs. Matches
        # the version used by the last known-good run; bump deliberately (#228).
        # 15.22.4 -> 15.24.0 (#271): checked the 15.16.0-15.24.0 changelog range —
        # no Firestore/Auth emulator regressions, no breaking changes; the auth
        # emulator picks up two "Premature close" reliability fixes (15.22.2/.3).
        run: npm install -g firebase-tools@15.24.0

      # Resolve the Windows emulator cache path at runtime and export it so the
      # cache action receives a plain string rather than an env context expression.
      - name: Set emulator cache path
        run: echo "EMULATOR_CACHE=$env:LOCALAPPDATA\firebase\emulators" >> $env:GITHUB_ENV

      # Cache the emulator JARs so they are only downloaded once per firebase.json change.
      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.EMULATOR_CACHE }}
          key: firebase-emulators-${{ hashFiles('firebase.json') }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # Start the emulator in the background. --project demo-test uses Firebase's
      # demo-project prefix so no real Firebase credentials are needed in CI.
      # shell: bash is required on windows-latest so that & backgrounds the process.
      - name: Start Firebase emulators
        shell: bash
        run: firebase emulators:start --only auth,firestore --project demo-test &

      # Poll until both emulator ports accept TCP connections before running tests.
      - name: Wait for emulators to be ready
        shell: bash
        run: |
          timeout 60 bash -c 'until (echo > /dev/tcp/localhost/8080) 2>/dev/null; do echo "waiting for Firestore..."; sleep 3; done'
          timeout 60 bash -c 'until (echo > /dev/tcp/localhost/9099) 2>/dev/null; do echo "waiting for Auth..."; sleep 3; done'
          echo "Emulators ready"

      # The suite runs as one long-lived Windows process; the native
      # firebase_firestore plugin occasionally crashes near the tail under
      # cumulative load (abrupt exit, no Dart error — see #228). Retry so a
      # single native flake doesn't fail CI. A genuine regression fails every
      # attempt and the job stays red, so real breakage is not masked.
      #
      # #264: retrying the test process alone could not absorb a *wedged
      # emulator* — the emulator is started once per job, so every attempt
      # reconnected to the same broken server and failed identically. Restart
      # the emulators between attempts so each retry is genuinely independent,
      # and allow a third attempt now that attempts are no longer correlated.
      # timeout_minutes stays at 20: successful runs take 8-14 minutes, so a
      # tighter ceiling would risk failing slow-but-healthy runners.
      - name: Run integration tests
        uses: nick-fields/retry@v3
        with:
          shell: pwsh
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 15
          # Explicit -File/-ExecutionPolicy rather than `./script.ps1`: this path
          # only ever runs after a failed attempt, so a latent execution-policy
          # problem here would stay invisible until the one moment it matters.
          on_retry_command: pwsh -NoProfile -ExecutionPolicy Bypass -File ./.github/scripts/restart-emulators.ps1
          command: flutter test integration_test/all_tests.dart -d windows --reporter expanded
