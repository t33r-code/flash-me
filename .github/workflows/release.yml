name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-to-play-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Decode the upload keystore from secrets and write key.properties.
      # Secrets required: KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD
      - name: Configure signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: Build release AAB
        run: flutter build appbundle --release

      # Upload the signed AAB to the Play Store internal testing track.
      # Secret required: PLAY_SERVICE_ACCOUNT_JSON (contents of the service account JSON file)
      # Upload the signed AAB to the Play Store internal testing track.
      # Secret required: PLAY_SERVICE_ACCOUNT_JSON (contents of the service account JSON file)
      # whatsnew/whatsnew-en-US is the "What's New" text shown in the Play Store (max 500 chars).
      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.t33r.agora
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          whatsNewDirectory: whatsnew

  # Deploys a web build to a dedicated Firebase Hosting test site, giving the
  # web test group access to each release without app-store review (#271).
  # Independent of release-to-play-store (no shared build artifacts) so it
  # runs in parallel; a failure here doesn't block the Play Store upload.
  deploy-web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      # Deploys to the `webtest` Hosting target (https://flash-me-test.web.app),
      # defined in firebase.json/.firebaserc alongside the `docs` (help site)
      # target. Secret required: FIREBASE_SERVICE_ACCOUNT_FLASH_ME_7A1A2
      # (generated via `firebase init hosting:github`).
      - name: Deploy web build to Firebase Hosting (test site)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLASH_ME_7A1A2 }}
          projectId: flash-me-7a1a2
          target: webtest
          channelId: live